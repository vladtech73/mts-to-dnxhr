<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MTS to DNxHR — color scheme mockups</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.4 "Segoe UI", system-ui, sans-serif;
      background: #030712;
      color: #f9fafb;
      padding: 24px;
    }
    h1 { font-size: 1.4rem; margin: 0 0 8px; }
    .intro { margin: 0 0 24px; max-width: 72rem; color: #9ca3af; }
    .intro code { color: #93c5fd; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 20px;
    }
    .card {
      background: #111827;
      border: 1px solid #374151;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 1px 3px rgba(0,0,0,.4);
    }
    .card header {
      padding: 10px 12px;
      border-bottom: 1px solid #374151;
      background: #1f2937;
    }
    .card header strong { display: block; font-size: 1rem; }
    .card header span { color: #9ca3af; font-size: 0.85rem; }
    .swatches { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px; border-bottom: 1px solid #374151; }
    .swatch {
      width: 28px; height: 28px; border-radius: 4px;
      border: 1px solid rgba(255,255,255,.2);
    }
    .mock {
      padding: 12px;
      font-size: 12px;
    }
    .win {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 3px;
      overflow: hidden;
    }
    .titlebar {
      background: var(--heading);
      color: var(--heading-fg);
      padding: 6px 10px;
      font-weight: 600;
      border-bottom: 1px solid var(--border);
    }
    .drop {
      margin: 10px;
      padding: 14px 10px;
      text-align: center;
      background: var(--drop);
      border: 2px solid var(--drop-border);
      border-radius: 2px;
    }
    .drop.hot {
      background: var(--drop-hot);
      border-color: var(--drop-hot-border);
      margin-top: 6px;
    }
    .drop .sub { color: var(--secondary); font-size: 11px; margin-top: 4px; }
    .btn-row { display: flex; gap: 6px; justify-content: center; margin-top: 8px; }
    .btn {
      background: var(--control);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 3px 8px;
      border-radius: 2px;
      font: inherit;
    }
    .btn:hover { background: var(--control-hover); }
    .btn.accent {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-fg);
      font-weight: 600;
    }
    .btn.accent:hover { background: var(--accent-active); border-color: var(--accent-active); }
    /* Live disabled Convert keeps the blue scheme (ACCENT_DISABLED / ACCENT_DISABLED_FG). */
    .btn.accent.disabled {
      background: var(--accent-disabled);
      border-color: var(--accent-disabled);
      color: var(--accent-disabled-fg);
    }
    .toolbar {
      display: flex; justify-content: space-between; align-items: center;
      margin: 0 10px 6px; font-weight: 600;
    }
    table {
      width: calc(100% - 20px);
      margin: 0 10px 10px;
      border-collapse: collapse;
      background: var(--field);
      border: 1px solid var(--border);
    }
    th {
      background: var(--heading);
      color: var(--heading-fg);
      text-align: left;
      padding: 5px 8px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
    }
    td { padding: 5px 8px; border-bottom: 1px solid var(--border); }
    tr.stripe td { background: var(--stripe); }
    tr.sel td { background: var(--select); color: var(--select-fg); }
    .st-wait { color: var(--muted); }
    .st-active { color: var(--active); font-weight: 600; }
    .st-ok { color: var(--ok); }
    .st-fail { color: var(--failed); }
    .settings {
      margin: 0 10px 10px;
      padding: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
    }
    .settings legend {
      padding: 0 4px;
      color: var(--text);
      font-weight: 600;
    }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
    .check {
      width: 14px; height: 14px; border: 2px solid var(--border);
      background: var(--control); display: inline-flex; align-items: center; justify-content: center;
      color: var(--active); font-size: 11px; font-weight: 700; line-height: 1;
    }
    .field {
      flex: 1; min-width: 80px; background: var(--field);
      border: 1px solid var(--border); padding: 3px 6px; color: var(--text);
    }
    .field.select { background: var(--control); }
    .field.select::after { content: " ▾"; color: var(--secondary); }
    .banner {
      margin: 0 10px 10px;
      padding: 6px 8px;
      background: var(--error-bg);
      color: var(--error-fg);
      border: 1px solid var(--error-border);
    }
    .footer {
      display: flex; gap: 8px; align-items: center;
      margin: 0 10px 10px;
    }
    .bar {
      flex: 1; height: 12px; background: var(--trough);
      border: 1px solid var(--trough); border-radius: 2px; overflow: hidden;
    }
    .bar > i {
      display: block; height: 100%; width: 42%;
      background: var(--accent);
    }
    .hint { color: var(--secondary); font-size: 11px; margin: 0 10px 10px; }
    .hexes {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 10px;
      color: #9ca3af;
      padding: 0 12px 12px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <h1>MTS to DNxHR — color scheme mockups</h1>
  <p class="intro">
    Live app palette matches ForecastEngineUI: stock Tailwind gray / blue / green / red
    (no custom chrome). Source of truth is <code>_Palette</code> in
    <code>mts_to_dnxhr_gui.py</code>. Open this file in a browser to preview.
  </p>
  <div class="grid" id="grid"></div>
  <script>
    const schemes = [
      {
        id: 1, name: "ForecastEngine / Tailwind dark", vibe: "gray-950 surfaces + blue-600 accent",
        // Mirrors _Palette in mts_to_dnxhr_gui.py (Tailwind step in comments).
        SURFACE: "#030712",          // gray-950
        FIELD: "#111827",            // gray-900
        STRIPE: "#1f2937",           // gray-800
        CONTROL_BG: "#1f2937",       // gray-800
        CONTROL_HOVER: "#374151",    // gray-700
        TEXT: "#f9fafb",             // gray-50
        TEXT_SECONDARY: "#9ca3af",   // gray-400
        TEXT_DISABLED: "#6b7280",    // gray-500
        BORDER: "#374151",           // gray-700
        HEADING_BG: "#111827",       // gray-900
        HEADING_FG: "#f9fafb",       // gray-50
        HEADING_ACTIVE: "#1f2937",   // gray-800
        ACCENT: "#2563eb",           // blue-600
        ACCENT_ACTIVE: "#1d4ed8",    // blue-700 (hover; white stays >= 4.5:1)
        ACCENT_FG: "#ffffff",        // white
        ACCENT_DISABLED: "#1e3a8a",  // blue-900
        ACCENT_DISABLED_FG: "#93c5fd", // blue-300
        SELECT_BG: "#172554",        // blue-950 (status colors stay >= 4.5:1)
        SELECT_FG: "#ffffff",        // white
        OK_FG: "#4ade80",            // green-400
        FAILED_FG: "#f87171",        // red-400
        ACTIVE_FG: "#60a5fa",        // blue-400 (also checkmark)
        MUTED_FG: "#9ca3af",         // gray-400
        ERROR_BG: "#450a0a",         // red-950
        ERROR_FG: "#fca5a5",         // red-300
        ERROR_BORDER: "#b91c1c",     // red-700
        DROP_BG: "#111827",          // gray-900
        DROP_HOT_BG: "#172554",      // blue-950
        DROP_PAUSED_BG: "#1f2937",   // gray-800
        DROP_BORDER: "#374151",      // gray-700
        DROP_HOT_BORDER: "#3b82f6",  // blue-500
        DISABLED_BG: "#1f2937",      // gray-800
        TROUGH: "#1f2937",           // gray-800
      },
    ];

    const grid = document.getElementById("grid");
    for (const s of schemes) {
      const el = document.createElement("article");
      el.className = "card";
      el.style.setProperty("--surface", s.SURFACE);
      el.style.setProperty("--field", s.FIELD);
      el.style.setProperty("--stripe", s.STRIPE);
      el.style.setProperty("--text", s.TEXT);
      el.style.setProperty("--secondary", s.TEXT_SECONDARY);
      el.style.setProperty("--text-disabled", s.TEXT_DISABLED);
      el.style.setProperty("--border", s.BORDER);
      el.style.setProperty("--heading", s.HEADING_BG);
      el.style.setProperty("--heading-fg", s.HEADING_FG);
      el.style.setProperty("--control", s.CONTROL_BG);
      el.style.setProperty("--control-hover", s.CONTROL_HOVER);
      el.style.setProperty("--accent", s.ACCENT);
      el.style.setProperty("--accent-active", s.ACCENT_ACTIVE);
      el.style.setProperty("--accent-disabled", s.ACCENT_DISABLED);
      el.style.setProperty("--accent-disabled-fg", s.ACCENT_DISABLED_FG);
      el.style.setProperty("--select-fg", s.SELECT_FG);
      el.style.setProperty("--accent-fg", s.ACCENT_FG);
      el.style.setProperty("--select", s.SELECT_BG);
      el.style.setProperty("--ok", s.OK_FG);
      el.style.setProperty("--failed", s.FAILED_FG);
      el.style.setProperty("--active", s.ACTIVE_FG);
      el.style.setProperty("--muted", s.MUTED_FG);
      el.style.setProperty("--error-bg", s.ERROR_BG);
      el.style.setProperty("--error-fg", s.ERROR_FG);
      el.style.setProperty("--error-border", s.ERROR_BORDER);
      el.style.setProperty("--drop", s.DROP_BG);
      el.style.setProperty("--drop-hot", s.DROP_HOT_BG);
      el.style.setProperty("--drop-border", s.DROP_BORDER);
      el.style.setProperty("--drop-hot-border", s.DROP_HOT_BORDER);
      el.style.setProperty("--disabled", s.DISABLED_BG);
      el.style.setProperty("--trough", s.TROUGH);

      el.innerHTML = `
        <header>
          <strong>${s.id}. ${s.name}</strong>
          <span>${s.vibe}</span>
        </header>
        <div class="swatches" aria-hidden="true">
          ${["SURFACE","FIELD","CONTROL_BG","BORDER","ACCENT","ACCENT_ACTIVE","ACTIVE_FG","SELECT_BG","OK_FG","FAILED_FG","DROP_HOT_BG"].map(k =>
            `<div class="swatch" style="background:${s[k]}" title="${k} ${s[k]}"></div>`
          ).join("")}
        </div>
        <div class="mock">
          <div class="win">
            <div class="titlebar">MTS to DNxHR</div>
            <div class="drop">
              <div>Drop .MTS / .M2TS files or folders here</div>
              <div class="sub">or click to browse</div>
              <div class="btn-row"><span class="btn">Add files…</span><span class="btn">Add folder…</span></div>
            </div>
            <div class="drop hot"><div class="sub">Drag highlight (hot)</div></div>
            <div class="toolbar"><span>Clips: 3</span><span><span class="btn">Remove</span> <span class="btn">Clear</span></span></div>
            <table>
              <thead><tr><th>File ▲</th><th>Status</th><th>Size</th></tr></thead>
              <tbody>
                <tr class="stripe"><td>clip1.mts</td><td class="st-wait">Waiting</td><td>335 MB</td></tr>
                <tr class="sel"><td>Clip2.MTS</td><td class="st-active">Converting 42%</td><td>128 MB</td></tr>
                <tr><td>clip10.MTS</td><td class="st-ok">Done</td><td>96 MB</td></tr>
                <tr class="stripe"><td>bad.MTS</td><td class="st-fail">Failed (double-click…)</td><td>12 MB</td></tr>
              </tbody>
            </table>
            <fieldset class="settings">
              <legend>Export settings</legend>
              <div class="row"><span>Export to:</span><span class="field">D:\\Exports\\DNxHR</span><span class="btn">Browse…</span></div>
              <div class="row">
                <span class="check"> </span> Deinterlace
                <span class="check">✓</span> GPU decode
                <span>Parallel streams:</span><span class="field select" style="flex:0;width:3rem">2</span>
                <span class="sub" style="color:var(--secondary)">(suggested max 2)</span>
              </div>
            </fieldset>
            <div class="banner">FFmpeg not found — install it, then Check again.</div>
            <div class="hint">Add clips, choose an export folder, then click Convert.</div>
            <div class="footer">
              <div class="bar"><i></i></div>
              <span class="btn accent">Convert</span>
              <span class="btn accent disabled">Convert</span>
            </div>
          </div>
        </div>
        <div class="hexes">
          Surface ${s.SURFACE} gray-950 · Field ${s.FIELD} gray-900 · Control ${s.CONTROL_BG} gray-800<br/>
          Accent ${s.ACCENT} blue-600 / hover ${s.ACCENT_ACTIVE} blue-700 · disabled ${s.ACCENT_DISABLED} blue-900<br/>
          Select ${s.SELECT_BG} blue-950 · Active ${s.ACTIVE_FG} blue-400 · Drop hot border ${s.DROP_HOT_BORDER} blue-500<br/>
          OK ${s.OK_FG} green-400 · Failed ${s.FAILED_FG} red-400 · Error ${s.ERROR_FG} on ${s.ERROR_BG} red-300/950
        </div>
      `;
      grid.appendChild(el);
    }
  </script>
</body>
</html>
